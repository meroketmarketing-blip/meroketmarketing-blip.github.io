<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meroket Kitchen</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef1ec;color:#18231c;display:grid;place-items:center;min-height:100vh;text-align:center}
  .spin{width:42px;height:42px;border:4px solid #d6dfd8;border-top-color:#436610;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
  @keyframes s{to{transform:rotate(360deg)}}
  button{margin-top:12px;background:#d1fc57;border:0;border-radius:20px;padding:10px 18px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><b>Meroket Kitchen</b><br><small>Memuatkan menu...</small></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzuz_ZPoYQmmpZZy-VTJnQCd0SRhhGBq-7HEn2aFXXMg0WOdG05SKdEvFxLm4LlUo6UBA/exec';
  var PAGE = document.documentElement.getAttribute('data-page') || 'index';
  var KP = 'mk_page_' + PAGE, KQ = 'mk_qr';

  function getC(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function setC(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function call(action, args) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, args: args || [] })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || 'Ralat pelayan.');
      return j.data;
    });
  }

  // Satu panggilan: design (kalau berubah) + menu/QR terkini
  var cp = getC(KP), cq = getC(KQ);
  var boot = call('boot', [PAGE, cp ? cp.hash : '', cq ? cq.hash : '']).then(function (r) {
    if (r.html) setC(KP, { hash: r.hash, html: r.html });
    if (r.config) {
      if (r.config.qr) setC(KQ, { hash: r.qrHash, data: r.config.qr });
      else if (r.qrHash && cq && cq.hash === r.qrHash) r.config.qr = cq.data;
      var lite = JSON.parse(JSON.stringify(r.config)); delete lite.qr;
      setC('mk_cfg', { cfg: lite, qrHash: r.qrHash || '' });
    }
    return r;
  });
  window.__mkBoot = boot;

  // Pengganti google.script.run supaya page asal boleh jalan di luar Apps Script
  var shim = '(' + function (API) {
    var usedBoot = false;
    function getC(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
    function sig(c) { var x = {}; for (var k in c) if (k !== 'qr') x[k] = c[k]; return JSON.stringify(x); }
    // Menu: papar salinan terakhir serta-merta, kemudian ganti dengan data terkini dari Sheet
    function fastConfig(ok, fail) {
      usedBoot = true;
      var shown = null, c = getC('mk_cfg'), q = getC('mk_qr');
      if (c && c.cfg && ok) {
        var cfg = c.cfg;
        if (q && q.hash && q.hash === c.qrHash) cfg.qr = q.data; else cfg.qr = '';
        shown = sig(cfg);
        try { ok(cfg); } catch (e) {}
      }
      window.__mkBoot.then(function (r) { return r.config || call('getConfig', []); },
                           function () { return call('getConfig', []); })
        .then(function (cfg) { if (sig(cfg) !== shown && ok) ok(cfg); },
              function (e) { if (shown === null && fail) fail(e instanceof Error ? e : new Error(String(e))); });
    }
    function call(action, args) {
      return fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, args: args })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (!j.ok) throw new Error(j.error || 'Ralat pelayan.');
        return j.data;
      });
    }
    function runner(ok, fail) {
      return new Proxy({}, { get: function (_, k) {
        if (k === 'withSuccessHandler') return function (h) { return runner(h, fail); };
        if (k === 'withFailureHandler') return function (h) { return runner(ok, h); };
        return function () {
          if (k === 'getConfig' && !usedBoot && window.__mkBoot) return fastConfig(ok, fail);
          var a = Array.prototype.slice.call(arguments);
          call(k, a).then(function (d) { if (ok) ok(d); }, function (e) {
            if (fail) fail(e instanceof Error ? e : new Error(String(e)));
          });
        };
      }});
    }
    window.google = { script: { run: runner(null, null) } };
  } + ')(' + JSON.stringify(API) + ');';

  function show(html) {
    html = html.replace(/<base[^>]*>/i, '');
    var tag = '<script>' + shim + '<\/script>';
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + tag; }) : tag + html;
    document.open();
    document.write(html);
    document.close();
  }

  function fail(err) {
    document.getElementById('boot').innerHTML =
      '<b>Tak dapat buka borang.</b><br><small>' + String(err && err.message || err).replace(/</g, '&lt;') +
      '</small><br><button onclick="location.reload()">Cuba lagi</button>';
  }

  function whenReady(fn) {
    // document.open() hanya ganti page bila page pemuat dah habis dimuat
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(fn, 0); });
    else setTimeout(fn, 0);
  }
  if (cp && cp.html) {
    whenReady(function () { show(cp.html); });               // terus papar design dari telefon
    boot.then(function (r) { if (r.html) location.reload(); }); // design dah berubah: muat semula sekali
  } else boot.then(function (r) { whenReady(function () { show(r.html); }); }).catch(fail); // kali pertama
})();
</script>
</body>
</html>
